name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      # Student PRs come from forks: they may only add one new games/<handle>/.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        # Run main's copy of the script, so a PR can't change the rules it is checked by.
        run: |
          git show origin/${{ github.base_ref }}:scripts/build-index.mjs > "$RUNNER_TEMP/build-index.mjs"
          node "$RUNNER_TEMP/build-index.mjs" --pr-scope origin/${{ github.base_ref }}
