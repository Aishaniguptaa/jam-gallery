name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      # Student PRs come from forks: they may only add one new games/<handle>/.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: node scripts/build-index.mjs --pr-scope origin/${{ github.base_ref }}
